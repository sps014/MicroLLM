[project]
name = "microllm"
version = "0.1.0"
description = "Tiny LLM that can do a lot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "datasets>=4.4.2",
    "tiktoken>=0.12.0",
    "torch",
    "torchvision",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

